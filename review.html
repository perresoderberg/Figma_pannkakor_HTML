<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/form.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
    <title>Oavsiktligt Ätbart</title>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="index.html">
          <img src="images/logo.png" alt="Oavsiktligt Ätbart" />
        </a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Recept</a></li>
        <li><a href="#">Om oss</a></li>
        <li><a href="contact.html">Kontakt</a></li>
      </ul>
      <select id="theme">
        <option value="light-theme">Ljus</option>
        <option value="dark-theme">Mörk</option>
      </select>
      <button class="login-btn">Logga in</button>
    </nav>
    <header class="hero-header">
      <h1>Oavsiktligt Ätbart</h1>
      <p>Beskriv vad som gick fel med receptet.</p>
      <p>Om det gick bra, så hittade du nog receptet på en annan sida.</p>
    </header>

    <div class="form-container">
      <h1>Din recension</h1>

      <form action="#" method="post">
        <div class="form-item">
          <label for="name">Namn</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Ex. Anna Svensson"
          />
        </div>

        <div class="form-item">
          <label for="email">E-post</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Ex. anna@gmail.com"
          />
        </div>

        <div class="form-item">
          <label for="recipe">Vilket recept gäller recensionen?</label>

          <select id="recipe" name="recipe">
            <option value="" disabled selected>Välj recept</option>
            <option>En normal pannkaka</option>
            <option>Inte goda pannkakor</option>
            <option>En lagom god pannkaka</option>
            <option>Smarrig pannkaka</option>
            <option>Söndagsmat</option>
          </select>
        </div>

        <div class="form-item">
          <label for="dateCooked"> När lagade du receptet? </label>

          <input type="date" id="dateCooked" name="dateCooked" />
        </div>

        <fieldset>
          <legend>Hur gick det?</legend>

          <label>
            <input type="radio" name="result" value="decent" required />
            Lagom bra
          </label>

          <label>
            <input type="radio" name="result" value="bad" required />
            Inte så bra
          </label>

          <label>
            <input type="radio" name="result" value="worst" required />
            Riktigt dåligt
          </label>

          <label>
            <input type="radio" name="result" value="disaster" required />
            Total katastrof
          </label>
        </fieldset>

        <div class="form-item">
          <label for="rating"> Betyg (1-6) </label>

          <input
            type="range"
            id="rating"
            name="rating"
            min="1"
            max="6"
            value="2"
          />
        </div>

        <div class="form-item">
          <label for="favoriteIngredient"> Favoritingrediens </label>

          <input
            type="text"
            id="favoriteIngredient"
            name="favoriteIngredient"
            placeholder="Ex. Choklad"
          />
        </div>

        <div class="form-item">
          <label for="review"> Berätta vad du tyckte </label>

          <textarea
            id="review"
            name="review"
            rows="6"
            required
            placeholder="Hur gick matlagningen?"
          ></textarea>
        </div>

        <div class="form-item">
          <label for="photo"> Ladda upp bild på resultatet </label>

          <input type="file" id="photo" name="photo" />
        </div>

        <div class="form-item">
          <label for="color">Vilken färg hade pannkakan?</label>

          <input
            type="color"
            id="color"
            value="#92400e"
            oninput="selectedColor.value = this.value"
          />

          <!-- <input type="text" id="selectedColor" value="#92400e" readonly /> -->
        </div>

        <div class="form-item checkbox-item">
          <label>
            <input type="checkbox" name="followRecipe" />
            Jag följde faktiskt receptet
          </label>
        </div>

        <div class="form-item checkbox-item">
          <label>
            <input type="checkbox" name="publishReview" />
            Publicera recensionen på webbplatsen
          </label>
        </div>

        <button type="submit" class="send-message-btn">Skicka recension</button>
      </form>
    </div>
  </body>
</html>
